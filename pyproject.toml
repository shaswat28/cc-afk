[project]
name = "cc-afk"
version = "0.1.0"
description = "Claude Code plugin: the /afk skill for unattended runs."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff.lint.isort]
known-first-party = ["afk"]
